<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fawzi Nabil El-Sherbiny — Senior Project Control Engineer and Planning Manager, Riyadh. Primavera P6, DCMA 14-Point, EVM, TIA/EOT, PMO governance.">
<meta property="og:title" content="Fawzi Nabil El-Sherbiny — Planning Manager & Senior Project Control">
<meta property="og:description" content="17+ years planning and controlling Saudi government and infrastructure programmes.">
<title>Fawzi El-Sherbiny Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
:root{color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a programme schedule read top to bottom — navy header band, gold data-date accents, sections as work packages on a light drafting ground. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#14213a; --muted:#5a6578; --line:#dde2ea;
  --navy:#0f2340; --navy-2:#1a3560; --gold:#b98b2e; --gold-soft:#e8c877; --onnavy:#eef2f8; --onnavy-mute:#a9b6cc;
  --crit:#c0533a; --chip:#eef1f6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --serif:"Libre Baskerville",Georgia,serif;
  --arabic:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1628; --surface:#12213b; --ink:#e7ecf4; --muted:#9fadc3; --line:#24365a;
  --navy:#081224; --navy-2:#162b4d; --gold:#d6a948; --gold-soft:#e8c877; --onnavy:#eef2f8; --onnavy-mute:#9fadc3;
  --crit:#e07a5f; --chip:#1a2b49; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1628; --surface:#12213b; --ink:#e7ecf4; --muted:#9fadc3; --line:#24365a;
  --navy:#081224; --navy-2:#162b4d; --gold:#d6a948; --gold-soft:#e8c877; --onnavy:#eef2f8; --onnavy-mute:#9fadc3;
  --crit:#e07a5f; --chip:#1a2b49; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
html[lang="ar"] body{font-family:var(--arabic)}
html[lang="ar"] .disp{font-family:var(--arabic);letter-spacing:0!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.disp{font-family:var(--display);font-weight:700;text-transform:uppercase}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--onnavy);border-bottom:2px solid var(--gold)}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;text-decoration:none}
.brand span{color:var(--gold-soft)}
nav{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;justify-content:center}
nav a{display:block;padding:6px 10px;font-size:14px;text-decoration:none;color:var(--onnavy-mute);white-space:nowrap;border-radius:4px}
nav a:hover{color:var(--onnavy);background:var(--navy-2)}
.tools{display:flex;gap:6px}
.tbtn{background:transparent;border:1px solid #3a4f75;color:var(--onnavy);font:600 13px var(--body);padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
html[lang="ar"] .tbtn{font-family:var(--arabic)}
.tbtn:hover{border-color:var(--gold)}

/* hero */
.hero{background:var(--navy);color:var(--onnavy)}
.hero .wrap.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;padding-block:48px 40px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gold-soft);border:1px solid #3a4f75;border-radius:99px;padding:5px 12px}
.badge i{width:8px;height:8px;border-radius:50%;background:#4caf7a;display:inline-block}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5vw,50px);line-height:1.12;margin:16px 0 6px;text-wrap:balance}
html[lang="ar"] .hero h1{font-family:var(--arabic);font-weight:700}
.role{font-family:var(--display);font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-soft);font-size:18px;margin:0 0 14px}
html[lang="ar"] .role{font-family:var(--arabic);letter-spacing:0;text-transform:none}
.lead{color:var(--onnavy-mute);max-width:56ch;margin:0 0 18px;font-size:17px}
.creds{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.creds span{font-size:13px;font-weight:600;background:var(--navy-2);border:1px solid #2d4369;padding:4px 10px;border-radius:4px}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:15px;padding:11px 20px;border-radius:5px;border:1.5px solid var(--gold);cursor:pointer}
.btn.pri{background:var(--gold);color:#0f2340}
.btn.sec{color:var(--onnavy)}
.btn:hover{filter:brightness(1.08)}
.hero-side{display:grid;gap:18px;min-width:0}
.photo{display:flex;gap:16px;align-items:center}
.photo img{width:112px;height:132px;object-fit:cover;border:2px solid var(--gold);border-radius:4px;flex:none}
.photo p{margin:0;font-size:14px;color:var(--onnavy-mute)}
.photo b{color:var(--onnavy);display:block;font-size:15px}
.gantt{background:#0b1a31;border:1px solid #2d4369;border-radius:6px;padding:12px 14px 10px}
.gantt svg{display:block;width:100%;height:auto;direction:ltr}
.gantt .cap{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--onnavy-mute);margin-top:6px}
.gantt .cap i{display:inline-block;width:14px;height:6px;margin-inline-end:5px;vertical-align:middle;border-radius:1px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #2d4369}
.stats div{padding:18px 8px;text-align:center;border-inline-start:1px solid #2d4369}
.stats div:first-child{border-inline-start:0}
.stats b{display:block;font-family:var(--serif);font-size:26px;color:var(--onnavy);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--onnavy-mute)}
html[lang="ar"] .stats span{letter-spacing:0}

/* sections */
section{padding-block:64px 8px;scroll-margin-top:60px}
.sh{display:grid;gap:6px;margin-bottom:28px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-size:14px}
html[lang="ar"] .eyebrow{font-family:var(--arabic);letter-spacing:0}
.sh h2{font-family:var(--serif);font-size:clamp(25px,3.4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
html[lang="ar"] .sh h2{font-family:var(--arabic);font-weight:700}
.sh p{margin:0;color:var(--muted);max-width:65ch}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.svc h3,.cs h3,.del h3{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:19px;margin:10px 0 6px;color:var(--ink)}
html[lang="ar"] .svc h3,html[lang="ar"] .cs h3,html[lang="ar"] .del h3{font-family:var(--arabic);text-transform:none;letter-spacing:0;font-size:17px}
.svc p,.del p{margin:0;color:var(--muted);font-size:15px}
.ico{width:38px;height:38px;border-radius:6px;background:var(--chip);display:grid;place-items:center;color:var(--gold)}
.ico svg{width:22px;height:22px}

/* timeline */
.tl{display:grid;gap:0}
.job{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px}
.job .yr{font-family:var(--display);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.5px;padding-top:18px;text-align:end}
.job .body{border-inline-start:2px solid var(--line);padding:16px 0 26px 24px;position:relative;min-width:0}
html[dir="rtl"] .job .body{padding:16px 24px 26px 0}
.job .body::before{content:"";position:absolute;inset-inline-start:-7px;top:22px;width:12px;height:12px;border-radius:2px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--gold)}
.job.now .body::before{background:var(--gold)}
.job h3{margin:0;font-size:18px;color:var(--ink)}
.job .org{color:var(--muted);font-size:15px;margin:2px 0 8px}
.job .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:1px 7px;margin-inline-start:8px;vertical-align:2px}
.job ul{margin:0;padding-inline-start:18px;color:var(--ink);font-size:15px}
.job li{margin-bottom:4px}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.fbtn{font:600 14px var(--body);background:var(--surface);color:var(--muted);border:1px solid var(--line);padding:7px 14px;border-radius:99px;cursor:pointer}
html[lang="ar"] .fbtn{font-family:var(--arabic)}
.fbtn[aria-pressed="true"]{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.prj{display:flex;flex-direction:column;gap:6px}
.prj .val{font-family:var(--serif);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.prj h3{margin:0;font-size:17px;line-height:1.35}
.prj .meta{font-size:14px;color:var(--muted)}
.prj .role2{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink)}
.cat{align-self:flex-start;font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:2px 8px;border-radius:3px}
html[lang="ar"] .cat{letter-spacing:0}

/* impact */
.impact{background:var(--navy);color:var(--onnavy);margin-top:64px}
.impact section{padding-block:56px}
.impact .sh h2{color:var(--onnavy)}
.impact .sh p{color:var(--onnavy-mute)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#2d4369;border:1px solid #2d4369}
.kpis div{background:var(--navy);padding:24px 20px}
.kpis b{font-family:var(--serif);font-size:34px;color:var(--gold-soft);display:block;font-variant-numeric:tabular-nums}
.kpis span{color:var(--onnavy-mute);font-size:15px}

/* clients */
.cl h3{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:0 0 12px;font-family:var(--display)}
html[lang="ar"] .cl h3{font-family:var(--arabic);letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font-size:14px}

/* case studies */
.cs .no{font-family:var(--serif);color:var(--gold);font-size:14px}
.cs dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:12px 0 0;font-size:15px}
.cs dt{font-weight:600;color:var(--gold);font-size:12.5px;letter-spacing:1px;text-transform:uppercase;padding-top:2px}
html[lang="ar"] .cs dt{letter-spacing:0}
.cs dd{margin:0;color:var(--ink)}

/* deliverables */
.del .thumb{height:92px;border-radius:4px;background:var(--chip);border:1px solid var(--line);display:block;overflow:hidden}
.del .thumb svg{width:100%;height:100%;display:block}
.note{margin-top:16px;font-size:14px;color:var(--muted)}

/* skills */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 12px;font-size:14.5px}
.tags span.k{border-color:var(--gold);color:var(--ink);font-weight:600}
.certs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}
.cert{display:flex;gap:14px;align-items:flex-start}
.cert .dm{flex:none;width:12px;height:12px;background:var(--gold);transform:rotate(45deg);margin-top:7px}
.cert b{display:block}
.cert span{font-size:14px;color:var(--muted)}

/* method */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.step{padding:18px 16px;border-top:3px solid var(--line);position:relative}
.step:nth-child(-n+5){border-top-color:var(--gold)}
.step .n{font-family:var(--serif);color:var(--gold);font-size:22px}
.step h3{margin:6px 0;font-size:17px}
.step p{margin:0;color:var(--muted);font-size:14.5px}

/* contact */
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ct .lbl{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="ar"] .ct .lbl{letter-spacing:0}
.ct .v{font-size:17px;font-weight:600;margin:6px 0 10px;word-break:break-word;user-select:all;direction:ltr;unicode-bidi:isolate}
html[dir="rtl"] .ct .v{text-align:right}
.cp{font:600 13px var(--body);background:var(--chip);color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:4px;cursor:pointer}
html[lang="ar"] .cp{font-family:var(--arabic)}
.cp:hover{border-color:var(--gold)}
footer{margin-top:64px;border-top:1px solid var(--line)}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}

@media (max-width:900px){
  .hero .wrap.top{grid-template-columns:minmax(0,1fr);gap:28px}
  .grid3,.grid4,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .contact{grid-template-columns:minmax(0,1fr)}
  nav{display:none}
  header .wrap{justify-content:space-between}
}
@media (max-width:600px){
  .grid3,.grid4,.grid2,.kpis,.certs,.steps{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats div:nth-child(3){border-inline-start:0}
  .stats div:nth-child(n+3){border-top:1px solid #2d4369}
  .job{grid-template-columns:minmax(0,1fr);gap:0}
  .job .yr{text-align:start;padding-top:8px}
}

</style>
</head>
